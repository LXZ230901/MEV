!
hostname CE2
!
feature bgp
feature nv overlay
feature vn-segment-vlan-based
!
!
interface loopback0
   no shutdown
   ip address 201.0.2.1/24
!
!
!
interface Ethernet1/1
    no shutdown
    ip address 12.0.1.2 255.255.255.0
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
router bgp 300
    router-id 201.0.2.0
    cluster-id 201.0.2.0
    address-family ipv4 unicast
        network 201.0.2.1/24
        neighbor 201.0.1.1
           remote-as 200
           update-source loopback0
           address-family l2vpn evpn
              send-community extended
        neighbor 12.0.1.1
           remote-as 100
           address-family ipv4 unicast
             send-community extended
     vrf slice0001
        address-family ipv4 unicast
           network 2.2.2.2/32
           advertise l2vpn evpn
!
!
vlan 11
    vn-segment 1
!
vrf context slice0001
    vni 1
    rd auto
    address-family ipv4 unicast
        route-target import 201:1 evpn
        route-target export 201:1 evpn
!
interface vlan 11
   no shutdown
   vrf member slice0001
!
interface Ethernet1/3
   no shutdown
   vrf member slice0001
   ip address 2.2.2.2/32
  !
!
interface nve 1
    no shutdown
    source-interface loopback0
    host-reachability protocol bgp
    member vni 1 associate-vrf
    !
