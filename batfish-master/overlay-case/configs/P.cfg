router bgp 100
    router-id 200.0.2.0
    cluster-id 200.0.2.0
    address-family ipv4 unicast
        neighbor 200.0.1.1
           remote-as 100
           update-source loopback0
           address-family ipv4 unicast
              send-community extended
              route-reflector-client
        neighbor 200.0.3.1
           remote-as 100
           update-source loopback0
           address-family ipv4 unicast
              send-community extended
              route-reflector-client
!
ip route 200.0.3.0/25 10.0.1.1