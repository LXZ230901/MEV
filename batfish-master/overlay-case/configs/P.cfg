hostname P
!
feature bgp
feature nv overlay
feature vn-segment-vlan-based
!
router isis
   is-type level-2
   net 49.0000.1921.6800.0000.00
!
interface loopback0
   no shutdown
   ip address 200.0.2.1/24
    ip router isis
!
!
!
interface Ethernet1/1
    no shutdown
    ip router isis
    ip address 10.0.1.2 255.255.255.0
!
interface Ethernet1/2
    no shutdown
    ip router isis
    ip address 10.0.2.1 255.255.255.0
